<app-logged-header></app-logged-header>

<div class="home-container">
  <div class="file-page">
    <h2 class="page-title">📄 Fájlok és AI összefoglalás</h2>

    <!-- 📤 Feltöltés -->
    <div class="upload-card">
      <h3>📤 Fájl feltöltése</h3>
      <div class="upload-row">
        <input type="file" (change)="onSelect($event)" />
        <button
          mat-raised-button
          color="primary"
          (click)="onUpload()"
          [disabled]="!selectedFile || loading"
        >
          Feltöltés
        </button>
      </div>
    </div>

    <!-- 📋 Lista -->
    <div class="files-card" *ngIf="hasLoaded && files.length > 0; else noFiles">
      <h3>📂 Fájljaid</h3>

      <div
        class="file-item"
        *ngFor="let file of files"
        [@listAnimation]
        [class.selected]="file.selected"
      >
        <mat-checkbox [(ngModel)]="file.selected"></mat-checkbox>

        <div class="file-info">
          <strong>{{ file.filename }}</strong>
          <span class="meta">
            {{ file.uploadedAt | date: 'yyyy.MM.dd. HH:mm' }}
          </span>
        </div>

        <!-- 🧠 AI összefoglalás dialógus -->
        <button
          mat-icon-button
          (click)="openSummaryDialog(file)"
          [disabled]="loading"
          matTooltip="AI összefoglalás"
        >
          <mat-icon>summarize</mat-icon>
        </button>

        <!-- 💾 Letöltés -->
        <button
          mat-icon-button
          color="primary"
          (click)="onDownload(file.id)"
          [disabled]="loading"
          matTooltip="Letöltés"
        >
          <mat-icon>download</mat-icon>
        </button>

        <!-- ❌ Törlés -->
        <button
          mat-icon-button
          color="warn"
          (click)="onDelete(file.id)"
          [disabled]="deletingId === file.id"
          matTooltip="Törlés"
        >
          <mat-icon *ngIf="deletingId !== file.id">delete</mat-icon>
          <mat-icon *ngIf="deletingId === file.id">hourglass_empty</mat-icon>
        </button>
      </div>
    </div>

    <ng-template #noFiles>
      <p class="empty">Még nincsenek feltöltött fájljaid.</p>
    </ng-template>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  </div>
</div>
